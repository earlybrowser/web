<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Early · A native macOS browser</title>
  <meta name="description" content="Early is an open-source native macOS browser inspired by Arc. Organize your browsing with vertical tabs, Favorites, folders, Spaces, and profiles. Actively in development.">
  <meta name="theme-color" content="#171819" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#d5d2cc" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/Early-Horizon-64.png">
  <link rel="apple-touch-icon" href="assets/Early-Horizon-1024.png">
  <link rel="stylesheet" href="styles.css?v=0a8fbcbdd65a">
</head>
<body>
  <a class="skip-link" href="#content-viewport">Skip to content</a>

  <div class="desktop-viewport">

    <div id="browser-window" class="browser-window" aria-label="Early browser preview">

      <button type="button" id="sidebar-reveal" class="toolbar-btn sidebar-reveal" aria-label="Show sidebar" aria-controls="sidebar" aria-expanded="false" title="Show sidebar">
        <svg width="16" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.35" aria-hidden="true"><rect x="1.5" y="1.75" width="15" height="12.5" rx="2.5"/><path d="M6.5 2v12"/></svg>
      </button>

      <div id="sidebar-edge-sensor" class="sidebar-edge-sensor" aria-hidden="true"></div>

      <aside id="sidebar" class="sidebar" aria-label="Sidebar">

        <div class="sidebar-top-group">

          <div class="navigation-controls" id="window-drag-region">

            <div id="traffic-lights" class="traffic-lights" aria-hidden="true">
              <span class="traffic-btn traffic-close"></span>
              <span class="traffic-btn traffic-minimize"></span>
              <span class="traffic-btn traffic-zoom"></span>
            </div>

            <span id="sidebar-toggle-btn" class="toolbar-btn" role="img" aria-label="Sidebar" title="Sidebar">
              <svg width="16" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="1.5" y="1.75" width="15" height="12.5" rx="2.5"/>
                <line x1="6.5" y1="1.75" x2="6.5" y2="14.25"/>
                <line x1="3.5" y1="4.75" x2="4.75" y2="4.75"/>
                <line x1="3.5" y1="7" x2="4.75" y2="7"/>
                <line x1="3.5" y1="9.25" x2="4.75" y2="9.25"/>
              </svg>
            </span>

            <div class="toolbar-spacer"></div>

            <button type="button" id="nav-back" class="toolbar-btn nav-chevron-btn" disabled aria-label="Back" title="Back (⌘[)">
              <svg class="chevron-svg" width="14" height="18" viewBox="0 0 14 18" fill="none" aria-hidden="true">
                <path class="chevron-path-back" d="M 10.08 2.88 L 3.36 9.00 L 10.08 15.12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <button type="button" id="nav-forward" class="toolbar-btn nav-chevron-btn" disabled aria-label="Forward" title="Forward (⌘])">
              <svg class="chevron-svg" width="14" height="18" viewBox="0 0 14 18" fill="none" aria-hidden="true">
                <path class="chevron-path-forward" d="M 3.92 2.88 L 10.64 9.00 L 3.92 15.12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <button type="button" id="nav-reload" class="toolbar-btn" aria-label="Reload" title="Reload (⌘R)">
              <div id="reload-stop-rotator" class="reload-stop-rotator">
                <svg class="reload-glyph" width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M14.8 4.2V7.8H11.2"/>
                  <path d="M14.5 7.8A6 6 0 1 0 14.8 11"/>
                </svg>
                <svg class="stop-glyph" width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4.5 4.5L13.5 13.5M13.5 4.5L4.5 13.5"/>
                </svg>
              </div>
            </button>

          </div>

          <div id="sidebar-address-bar" class="sidebar-address-bar">
            <button type="button" id="address-edit-btn" class="address-edit-btn" aria-label="Edit address" title="Search this site or enter an address (⌘K / Ctrl K)">
              <svg id="address-search-icon" class="address-search-icon" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="7" cy="7" r="4.8"/>
                <line x1="10.6" y1="10.6" x2="14" y2="14"/>
              </svg>
              <span id="address-bar-label" class="address-bar-label is-placeholder">Search…</span>
            </button>
            <button type="button" id="address-site-controls-btn" class="address-link-btn" style="display: none;" aria-label="Site controls" aria-haspopup="dialog" aria-expanded="false" aria-controls="site-controls-panel" title="Site Controls">
              <!-- Keep in sync with early-browser's SiteControlsGlyph. -->
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="4.5"/>
                <path d="M7 9.5h1.1M11.9 9.5H17M7 14.5h5.1M15.9 14.5H17"/>
                <circle cx="10" cy="9.5" r="1.9"/><circle cx="14" cy="14.5" r="1.9"/>
              </svg>
            </button>
          </div>
          <div id="site-controls-panel" class="site-controls-panel" role="dialog" aria-label="Site controls" hidden>
            <p id="site-controls-host" class="site-controls-host"></p>
            <p id="site-controls-url" class="site-controls-url"></p>
            <button type="button" id="site-controls-copy" class="site-controls-copy" title="Copy URL (⌘⇧C)">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6.8 9.2a3.2 3.2 0 0 0 4.5 0l2-2a3.2 3.2 0 0 0-4.5-4.5L7.7 3.8"/>
                <path d="M9.2 6.8a3.2 3.2 0 0 0-4.5 0l-2 2a3.2 3.2 0 0 0 4.5 4.5l1.1-1.1"/>
              </svg>
              Copy Link
            </button>
          </div>

        </div>

        <div class="favorites-section" aria-label="Favorites">
          <div class="favorites-grid">
            <a href="https://github.com/earlybrowser/early-browser" target="_blank" rel="noopener noreferrer" class="favorite-tile" id="fav-github" aria-label="Early on GitHub (opens in a new tab)" title="GitHub&#10;https://github.com/earlybrowser/early-browser">
              <svg width="20" height="20" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8C0 11.54 2.29 14.53 5.47 15.59C5.87 15.66 6.02 15.42 6.02 15.21C6.02 15.02 6.01 14.39 6.01 13.72C4 14.09 3.48 13.23 3.32 12.78C3.23 12.55 2.84 11.84 2.5 11.65C2.22 11.5 1.82 11.13 2.49 11.12C3.12 11.11 3.57 11.7 3.72 11.94C4.44 13.15 5.59 12.81 6.05 12.6C6.12 12.08 6.33 11.73 6.56 11.53C4.78 11.33 2.92 10.64 2.92 7.58C2.92 6.71 3.23 5.99 3.74 5.43C3.66 5.23 3.38 4.41 3.82 3.31C3.82 3.31 4.49 3.1 6.02 4.13C6.66 3.95 7.34 3.86 8.02 3.86C8.7 3.86 9.38 3.95 10.02 4.13C11.55 3.09 12.22 3.31 12.22 3.31C12.66 4.41 12.38 5.23 12.3 5.43C12.81 5.99 13.12 6.7 13.12 7.58C13.12 10.65 11.25 11.33 9.47 11.53C9.76 11.78 10.01 12.26 10.01 13.01C10.01 14.08 10 14.94 10 15.21C10 15.42 10.15 15.67 10.55 15.59C13.71 14.53 16 11.53 16 8C16 3.58 12.42 0 8 0Z" transform="scale(64)" fill="#ffffff"/>
              </svg>
            </a>

            <a href="mailto:earlybrowser.dev@gmail.com" class="favorite-tile" id="fav-mail" aria-label="Email Early" title="Mail&#10;earlybrowser.dev@gmail.com">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 192 192" aria-hidden="true">
                <path fill="url(#a)" d="M146 44h38v110c0 6.627-5.373 12-12 12h-20a6 6 0 0 1-6-6z"/>
                <path fill="#fc413d" d="M46 44H8v110c0 6.627 5.373 12 12 12h20a6 6 0 0 0 6-6z"/>
                <path fill="url(#b)" d="M39.226 30.456c-8.033-6.752-20.018-5.714-26.77 2.319-6.752 8.032-5.714 20.017 2.319 26.77l76.078 63.949a8 8 0 0 0 10.295 0l76.078-63.95c8.032-6.752 9.07-18.737 2.318-26.77-6.752-8.032-18.737-9.07-26.769-2.318L96 78.18z"/>
                <defs>
                  <linearGradient id="a" x1="165" x2="165" y1="44" y2="166" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#60d673"/>
                    <stop offset=".17" stop-color="#42c868"/>
                    <stop offset=".39" stop-color="#0ebc5f"/>
                    <stop offset=".62" stop-color="#00a9bb"/>
                    <stop offset=".86" stop-color="#3c90ff"/>
                    <stop offset="1" stop-color="#3186ff"/>
                  </linearGradient>
                  <linearGradient id="b" x1="8" x2="184" y1="46.13" y2="46.13" gradientUnits="userSpaceOnUse">
                    <stop offset=".08" stop-color="#ff63a0"/>
                    <stop offset=".3" stop-color="#fc413d"/>
                    <stop offset=".5" stop-color="#fc413d"/>
                    <stop offset=".65" stop-color="#fc413d"/>
                    <stop offset=".72" stop-color="#fc5c30"/>
                    <stop offset=".86" stop-color="#feb10c"/>
                    <stop offset=".91" stop-color="#fec700"/>
                    <stop offset=".96" stop-color="#ffdb0f"/>
                  </linearGradient>
                </defs>
              </svg>
            </a>

            <a href="https://github.com/sponsors/rangaNP" target="_blank" rel="noopener noreferrer" class="favorite-tile" id="fav-sponsors" aria-label="Sponsor Early on GitHub (opens in a new tab)" title="GitHub Sponsors&#10;https://github.com/sponsors/rangaNP">
              <svg width="20" height="20" fill="#EA4AAA" role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <title>GitHub Sponsors</title>
                <path d="M17.625 1.499c-2.32 0-4.354 1.203-5.625 3.03-1.271-1.827-3.305-3.03-5.625-3.03C3.129 1.499 0 4.253 0 8.249c0 4.275 3.068 7.847 5.828 10.227a33.14 33.14 0 0 0 5.616 3.876l.028.017.008.003-.001.003c.163.085.342.126.521.125.179.001.358-.041.521-.125l-.001-.003.008-.003.028-.017a33.14 33.14 0 0 0 5.616-3.876C20.932 16.096 24 12.524 24 8.249c0-3.996-3.129-6.75-6.375-6.75zm-.919 15.275a30.766 30.766 0 0 1-4.703 3.316l-.004-.002-.004.002a30.955 30.955 0 0 1-4.703-3.316c-2.677-2.307-5.047-5.298-5.047-8.523 0-2.754 2.121-4.5 4.125-4.5 2.06 0 3.914 1.479 4.544 3.684.143.495.596.797 1.086.796.49.001.943-.302 1.085-.796.63-2.205 2.484-3.684 4.544-3.684 2.004 0 4.125 1.746 4.125 4.5 0 3.225-2.37 6.216-5.048 8.523z"/>
              </svg>
            </a>
          </div>
        </div>

        <div class="space-contents">

          <div class="space-header-row">
            <span id="active-space-title" class="space-header-title">Personal</span>
          </div>

          <div id="sidebar-scroll" class="sidebar-scroll" role="region" aria-label="Tabs">
            <div class="sidebar-list">

              <div class="pinned-spacer"></div>

              <div id="pinned-items-container" class="pinned-items-container"></div>

              <div class="pinned-spacer"></div>

              <div class="sidebar-divider-wrap">
                <div class="sidebar-divider"></div>
              </div>

              <button type="button" id="new-tab-btn" class="new-tab-btn" title="Open the command bar (⌘K / Ctrl K on this website)">
                <span class="new-tab-left">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                    <line x1="8" y1="3" x2="8" y2="13"/>
                    <line x1="3" y1="8" x2="13" y2="8"/>
                  </svg>
                  <span>New Tab</span>
                </span>
                <span class="new-tab-shortcut">⌘T</span>
              </button>

              <div id="today-tabs-container" class="today-tabs-container"></div>

            </div>
          </div>

        </div>

        <div id="sidebar-footer" class="sidebar-footer" aria-label="Spaces">
          <button type="button" id="footer-download" class="footer-icon-btn" aria-label="Download and installation information" title="Download & Install">
            <!-- Original Early artwork; matches DownloadGlyph in the native app. -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7.75v7.75"/>
              <path d="M8.5 12 12 15.5 15.5 12"/>
            </svg>
          </button>

          <div id="space-indicator-strip" class="space-indicator-strip" aria-label="Active Space">
            <div class="space-dot-btn is-active" title="Personal · preview Space" aria-label="Personal, current Space">
              <span class="space-default-dot"></span>
            </div>
          </div>

          <button type="button" id="footer-spaces" class="footer-icon-btn" aria-label="Learn about Spaces in Early" title="Explore Spaces">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <line x1="8" y1="3.2" x2="8" y2="12.8"/>
              <line x1="3.2" y1="8" x2="12.8" y2="8"/>
            </svg>
          </button>
        </div>

        <div id="sidebar-resize-handle" class="sidebar-resize-handle" role="separator" tabindex="0" aria-label="Sidebar width" aria-orientation="vertical" aria-valuemin="220" aria-valuemax="360" aria-valuenow="240" title="Drag or use arrow keys to resize sidebar (220–360 pt)"></div>

      </aside>

      <main id="content-area" class="content-area" aria-label="Web Content">

        <div id="command-bar-layer" class="command-bar-layer" hidden>
          <div id="command-bar-card" class="command-bar-card" role="dialog" aria-label="Command bar" aria-modal="false">
            <div class="command-bar-input-row">
              <svg class="command-bar-search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="7" cy="7" r="4.8"/>
                <line x1="10.6" y1="10.6" x2="14" y2="14"/>
              </svg>
              <textarea id="command-bar-input" class="command-bar-input" rows="1" maxlength="2048" placeholder="Search or enter a URL" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-label="Search Early or enter a URL" aria-autocomplete="list" aria-controls="command-bar-suggestions" aria-expanded="false" aria-describedby="command-bar-hint"></textarea>
              <button type="button" id="command-bar-dismiss" class="command-bar-dismiss" aria-label="Dismiss command bar" title="Dismiss (Escape)">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                  <line x1="4" y1="4" x2="12" y2="12"/>
                  <line x1="12" y1="4" x2="4" y2="12"/>
                </svg>
              </button>
            </div>
            <p id="command-bar-hint" class="command-bar-hint sr-only"></p>
            <div id="command-bar-suggestions-wrap" class="command-bar-suggestions-wrap" hidden>
              <div class="command-bar-divider"></div>
              <div id="command-bar-suggestions" class="command-bar-suggestions" role="listbox" aria-label="Suggested destinations"></div>
            </div>
          </div>
        </div>

        <div id="toast-host" class="toast-host" role="status" aria-live="polite" aria-atomic="true"></div>
        <div id="command-bar-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

        <div id="content-viewport" class="content-viewport" tabindex="-1">
          <noscript>
            <style>.sidebar, .sidebar-reveal { display: none; } .content-area { margin-left: 0; }</style>
            <article class="page-container">
              <h1>Early</h1>
              <p class="intro">An open-source native macOS browser inspired by Arc, with vertical tabs, Favorites, folders, Spaces, and profiles.</p>
              <p class="information-note">Actively in development. Not production-ready yet. Enable JavaScript to explore the interactive browser preview.</p>
              <p><a href="https://github.com/earlybrowser/early-browser">Visit the project and build Early from source</a>.</p>
            </article>
          </noscript>
        </div>

      </main>

    </div>

  </div>

  <script src="features-data.js?v=0f0cad8eacb1"></script>
  <script src="site-model.js?v=ba31e3c3acd2"></script>
  <script src="app.js?v=827ed8f56681"></script>
</body>
</html>
