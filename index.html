<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Early — A Native macOS Browser</title>
  <meta name="description" content="A fast, lightweight native macOS browser built with Swift 6, SwiftUI, AppKit, and WebKit.">
  <link rel="icon" type="image/png" href="assets/Early-Default-64.png">
  <link rel="apple-touch-icon" href="assets/Early-Default-1024.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-appearance="dark">

  <!-- Desktop Viewport -->
  <div class="desktop-viewport">

    <!-- Browser Window (BrowserWindowView.swift) -->
    <div id="browser-window" class="browser-window" role="application" aria-label="Early Browser">

      <!-- Left Edge Hover Sensor for Auto-Hide Sidebar Reveal (2pt width at rest) -->
      <div id="sidebar-edge-sensor" class="sidebar-edge-sensor" aria-label="Reveal sidebar"></div>

      <!-- LEFT SIDEBAR (BrowserWindowView.sidebar) -->
      <aside id="sidebar" class="sidebar" aria-label="Sidebar">

        <!-- Top Group: VStack(spacing: 8) { navigationControls; addressBar } -->
        <div class="sidebar-top-group">

          <!-- navigationControls: HStack(spacing: 6) -->
          <div class="navigation-controls" id="window-drag-region">

            <!-- WindowControls().frame(width: 60, height: 32) -->
            <div id="traffic-lights" class="traffic-lights" aria-label="Window Controls">
              <button type="button" id="traffic-close" class="traffic-btn traffic-close" aria-label="Close" title="Close">
                <svg class="traffic-glyph" viewBox="0 0 14 14" aria-hidden="true">
                  <path d="M4.1 4.1L9.9 9.9M9.9 4.1L4.1 9.9" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
                </svg>
              </button>
              <button type="button" id="traffic-min" class="traffic-btn traffic-minimize" aria-label="Minimize" title="Minimize">
                <svg class="traffic-glyph" viewBox="0 0 14 14" aria-hidden="true">
                  <path d="M3.5 7H10.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
                </svg>
              </button>
              <button type="button" id="traffic-zoom" class="traffic-btn traffic-zoom" aria-label="Full Screen" title="Toggle Full Screen">
                <svg class="traffic-glyph" viewBox="0 0 14 14" aria-hidden="true">
                  <path d="M3.6 6.4V3.6H6.4L3.6 6.4ZM10.4 7.6V10.4H7.6L10.4 7.6Z" fill="currentColor"/>
                </svg>
              </button>
            </div>

            <!-- Sidebar Toggle Button: Image(systemName: "sidebar.left").frame(width: 32, height: 32) -->
            <button type="button" id="sidebar-toggle-btn" class="toolbar-btn" aria-label="Toggle sidebar auto-hide" title="Toggle sidebar auto-hide (⌘⇧S)">
              <svg width="16" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="1.5" y="1.75" width="15" height="12.5" rx="2.5"/>
                <line x1="6.5" y1="1.75" x2="6.5" y2="14.25"/>
                <line x1="3.5" y1="4.75" x2="4.75" y2="4.75"/>
                <line x1="3.5" y1="7" x2="4.75" y2="7"/>
                <line x1="3.5" y1="9.25" x2="4.75" y2="9.25"/>
              </svg>
            </button>

            <div class="toolbar-spacer"></div>

            <!-- Back Button: NavigationChevron(pointsRight: false) -->
            <button type="button" id="nav-back" class="toolbar-btn nav-chevron-btn" disabled aria-label="Back" title="Back (⌘[)">
              <svg class="chevron-svg" width="14" height="18" viewBox="0 0 14 18" fill="none" aria-hidden="true">
                <path class="chevron-path-back" d="M 10.08 2.88 L 3.36 9.00 L 10.08 15.12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <!-- Forward Button: NavigationChevron(pointsRight: true) -->
            <button type="button" id="nav-forward" class="toolbar-btn nav-chevron-btn" disabled aria-label="Forward" title="Forward (⌘])">
              <svg class="chevron-svg" width="14" height="18" viewBox="0 0 14 18" fill="none" aria-hidden="true">
                <path class="chevron-path-forward" d="M 3.92 2.88 L 10.64 9.00 L 3.92 15.12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <!-- Reload Button: ReloadStopArtwork -->
            <button type="button" id="nav-reload" class="toolbar-btn" aria-label="Reload" title="Reload (⌘R)">
              <div id="reload-stop-rotator" class="reload-stop-rotator">
                <svg class="reload-glyph" width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M14.8 4.2V7.8H11.2"/>
                  <path d="M14.5 7.8A6 6 0 1 0 14.8 11"/>
                </svg>
              </div>
            </button>

          </div>

          <!-- addressBar: Button (36pt height, cornerRadius 12) -->
          <div id="sidebar-address-bar" class="sidebar-address-bar" role="button" tabindex="0" aria-label="Address bar" title="Search or enter a URL (⌘L)">
            <svg id="address-search-icon" class="address-search-icon" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="7" cy="7" r="4.8"/>
              <line x1="10.6" y1="10.6" x2="14" y2="14"/>
            </svg>
            <span id="address-bar-label" class="address-bar-label is-placeholder">Search…</span>
            <span class="address-bar-spacer"></span>
            <button type="button" id="address-copy-link-btn" class="address-link-btn" style="display: none;" aria-label="Copy current page URL" title="Copy URL (⌘⇧C)">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6.8 9.2a3.2 3.2 0 0 0 4.5 0l2-2a3.2 3.2 0 0 0-4.5-4.5L7.7 3.8"/>
                <path d="M9.2 6.8a3.2 3.2 0 0 0-4.5 0l-2 2a3.2 3.2 0 0 0 4.5 4.5l1.1-1.1"/>
              </svg>
            </button>
          </div>

        </div>

        <!-- favoritesSection: GitHub, Mail, Buy Me a Coffee (43.2pt height, cornerRadius 9) -->
        <div class="favorites-section" aria-label="Favorites">
          <div class="favorites-grid">
            <!-- GitHub -->
            <a href="https://github.com/earlybrowser/early-browser" target="_blank" rel="noopener noreferrer" class="favorite-tile" id="fav-github" title="GitHub&#10;https://github.com/earlybrowser/early-browser">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
              </svg>
            </a>

            <!-- Mail -->
            <a href="mailto:earlybrowser.dev@gmail.com" class="favorite-tile" id="fav-mail" title="Mail&#10;earlybrowser.dev@gmail.com">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>
                <path d="M3 6l9 6.5L21 6"/>
              </svg>
            </a>

            <!-- Buy Me a Coffee -->
            <a href="https://buymeacoffee.com/earlybrowser" target="_blank" rel="noopener noreferrer" class="favorite-tile" id="fav-bmac" title="Buy Me a Coffee&#10;https://buymeacoffee.com/earlybrowser">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17 8h1.5a3.5 3.5 0 0 1 0 7H17"/>
                <path d="M3 8h14v7.5a4.5 4.5 0 0 1-4.5 4.5h-5A4.5 4.5 0 0 1 3 15.5V8z"/>
                <line x1="6.5" y1="2.5" x2="6.5" y2="5"/>
                <line x1="10" y1="2.5" x2="10" y2="5"/>
                <line x1="13.5" y1="2.5" x2="13.5" y2="5"/>
              </svg>
            </a>
          </div>
        </div>

        <!-- spacePager -> spaceContents: VStack(alignment: .leading, spacing: 16) -->
        <div class="space-contents">

          <!-- Space Header: Text(space.name).font(.callout.weight(.medium)).foregroundStyle(.secondary).padding(.horizontal, 8) -->
          <div class="space-header-row">
            <span id="active-space-title" class="space-header-title">Personal</span>
          </div>

          <!-- Unified ScrollView for Feature Folders, Divider, New Tab, and Today Tabs -->
          <div id="sidebar-scroll" class="sidebar-scroll" role="region" aria-label="Tabs">
            <div class="sidebar-list">

              <!-- pinnedStart spacer (4pt) -->
              <div class="pinned-spacer"></div>

              <!-- Feature-Wise Folders Container -->
              <div id="pinned-items-container" class="pinned-items-container"></div>

              <!-- pinnedEnd spacer (4pt) -->
              <div class="pinned-spacer"></div>

              <!-- Divider().padding(.vertical, 8) -->
              <div class="sidebar-divider-wrap">
                <div class="sidebar-divider"></div>
              </div>

              <!-- newTabButton: Label("New Tab", systemImage: "plus") + Spacer() + Text("⌘T") -->
              <button type="button" id="new-tab-btn" class="new-tab-btn" title="Open the command bar (⌘T)">
                <span class="new-tab-left">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                    <line x1="8" y1="3" x2="8" y2="13"/>
                    <line x1="3" y1="8" x2="13" y2="8"/>
                  </svg>
                  <span>New Tab</span>
                </span>
                <span class="new-tab-shortcut">⌘T</span>
              </button>

              <!-- Today Tabs Container (Homepage tab + Today tabs) -->
              <div id="today-tabs-container" class="today-tabs-container"></div>

            </div>
          </div>

        </div>

        <!-- sidebarFooter: SpaceFooter (SpaceControls.swift) -->
        <div id="sidebar-footer" class="sidebar-footer" aria-label="Spaces">
          <!-- Reserved Downloads icon: Image(systemName: "arrow.down.circle").foregroundStyle(.tertiary).frame(width: 28, height: 28) -->
          <div class="footer-icon-btn is-tertiary" aria-label="Downloads" title="Downloads">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="8" cy="8" r="6.2"/>
              <polyline points="5.6 8.3 8 10.7 10.4 8.3"/>
              <line x1="8" y1="5.2" x2="8" y2="10.5"/>
            </svg>
          </div>

          <!-- indicatorStrip: Space dot -->
          <div id="space-indicator-strip" class="space-indicator-strip" aria-label="Active Space">
            <div class="space-dot-btn is-active" title="Personal">
              <span class="space-default-dot"></span>
            </div>
          </div>

          <!-- New Space icon: Image(systemName: "plus").frame(width: 28, height: 28) -->
          <div class="footer-icon-btn" aria-label="New Space" title="New Space">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
              <line x1="8" y1="3.2" x2="8" y2="12.8"/>
              <line x1="3.2" y1="8" x2="12.8" y2="8"/>
            </svg>
          </div>
        </div>

        <!-- Sidebar Resize Handle (220pt–360pt) -->
        <div id="sidebar-resize-handle" class="sidebar-resize-handle" role="separator" aria-label="Sidebar width" title="Drag to resize sidebar (220–360 pt)"></div>

      </aside>

      <!-- RIGHT WEB CONTENT AREA (BrowserWindowView ZStack content area) -->
      <main id="content-area" class="content-area" aria-label="Web Content">

        <!-- 2pt Top Page Loading Line -->
        <div id="page-loading-line" class="page-loading-line" aria-hidden="true"></div>

        <!-- FLOATING COMMAND BAR (CommandBarView.swift — No full-screen backdrop) -->
        <div id="command-bar-layer" class="command-bar-layer" style="display: none;">
          <div id="command-bar-card" class="command-bar-card" role="dialog" aria-label="Command Bar">
            <div class="command-bar-input-row">
              <svg class="command-bar-search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="7" cy="7" r="4.8"/>
                <line x1="10.6" y1="10.6" x2="14" y2="14"/>
              </svg>
              <input type="text" id="command-bar-input" class="command-bar-input" placeholder="Search or enter a URL" autocomplete="off" spellcheck="false" aria-label="Search or enter a URL">
              <button type="button" id="command-bar-dismiss" class="command-bar-dismiss" aria-label="Dismiss command bar" title="Dismiss (Escape)">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                  <line x1="4" y1="4" x2="12" y2="12"/>
                  <line x1="12" y1="4" x2="4" y2="12"/>
                </svg>
              </button>
            </div>
            <div id="command-bar-suggestions-wrap" class="command-bar-suggestions-wrap" style="display: none;">
              <div class="command-bar-divider"></div>
              <div id="command-bar-suggestions" class="command-bar-suggestions" role="listbox"></div>
            </div>
          </div>
        </div>

        <!-- Top-Trailing Native Toast (BrowserWindowView.toast) -->
        <div id="toast-host" class="toast-host" aria-live="polite"></div>

        <!-- SCROLLABLE VIEWPORT -->
        <div id="content-viewport" class="content-viewport"></div>

      </main>

    </div>

  </div>

  <script src="features-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
